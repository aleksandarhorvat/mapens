services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HF_HOME: /hf-cache
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
    command: bash -c "bash scripts/setup.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      # code mounted for development: restart the container to pick up changes
      - ./backend/app:/app/app
      - ./scripts:/app/scripts
      - hf-cache:/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  hf-cache:
